<title>Accenture OA Tracker</title>

<style>
/* Layout: one narrow column — progress header, filter bar, then numbered rows grouped by phase */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --ink:#1d2421; --muted:#5f6b66; --line:#dde2df;
  --accent:#1f5f8b; --accent-soft:#e3eef6; --done:#2e7d4f; --done-soft:#e4f2e9; --hot:#b4532a; --hot-soft:#f8ebe4;
  --dsa:#1f5f8b; --sql:#7a4fa3; --web:#a0661c;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --ink:#e6ebe8; --muted:#9aa6a0; --line:#2c3531;
  --accent:#7fb4dc; --accent-soft:#1d2c38; --done:#72c393; --done-soft:#1a2c22; --hot:#e59a74; --hot-soft:#33231b;
  --dsa:#7fb4dc; --sql:#bb97de; --web:#dfae63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --ink:#e6ebe8; --muted:#9aa6a0; --line:#2c3531;
  --accent:#7fb4dc; --accent-soft:#1d2c38; --done:#72c393; --done-soft:#1a2c22; --hot:#e59a74; --hot-soft:#33231b;
  --dsa:#7fb4dc; --sql:#bb97de; --web:#dfae63; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
h1{font-size:1.6rem;margin:0 0 4px;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px;max-width:65ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat .num{font-family:var(--mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.row input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{margin-left:auto;font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.save{font-size:.8rem;color:var(--muted);min-height:1.2em;margin-bottom:10px}
section{margin-top:22px}
section h2{font-size:1rem;margin:0 0 2px;display:flex;gap:8px;align-items:baseline}
section h2 .count{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:500}
section .note{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.priority{background:var(--hot-soft);border:1px solid color-mix(in srgb,var(--hot) 35%,transparent);border-radius:10px;padding:14px 14px 8px}
.priority h2{color:var(--hot)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:26px 44px minmax(0,1fr);gap:4px 8px;align-items:start;padding:10px 4px;border-top:1px solid var(--line)}
.priority .row{border-top-color:color-mix(in srgb,var(--hot) 20%,transparent)}
.row:first-child{border-top:0}
.row input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--done);cursor:pointer}
.row .n{font-family:var(--mono);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.row.done .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.row.done .n{color:var(--done)}
.t{font-weight:600}
.meta{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.sec{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.sec.DSA{color:var(--dsa)}.sec.SQL{color:var(--sql)}.sec.Web{color:var(--web)}
.lv.Medium{color:var(--hot)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.links a{font-size:.8rem;text-decoration:none;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 8px}
.links a:hover{text-decoration:underline}
.links a.stmt{color:var(--hot);background:var(--hot-soft)}
.when{font-family:var(--mono);font-size:.75rem;color:var(--done)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 4px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

  $("stats").innerHTML = parts.map(([lab, qs]) => {
    const d = qs.filter(q => done[q.n]).length, pct = qs.length ? Math.round(d / qs.length * 100) : 0;
    return `<div class="stat"><div class="lab">${lab}</div><div class="num">${d} / ${qs.length}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}

function rowHTML(q){
  const isDone = !!done[q.n];
  const links = q.links.map(([num, name, slug]) => `<a href="${LC(slug)}" target="_blank" rel="noopener">LC ${num} · ${esc(name)}</a>`);
  if (q.stmt) links.push(`<a class="stmt" href="${DOC}" target="_blank" rel="noopener">Statement: ${esc(q.stmt)}</a>`);
  return `<div class="row${isDone ? " done" : ""}">
    <input type="checkbox" id="q${q.n}" data-n="${q.n}" ${isDone ? "checked" : ""} aria-label="Mark question ${q.n} done">
    <label class="n" for="q${q.n}">${q.n}</label>
    <div>
      <div class="t">${esc(q.title)}</div>
      <div class="meta"><span class="sec ${q.sec}">${q.sec}</span><span>${esc(q.pat)}</span><span class="lv ${q.lv}">${q.lv}</span><span>${esc(q.src)}</span>${isDone ? `<span class="when">done ${esc(done[q.n])}</span>` : ""}</div>
      ${links.length ? `<div class="links">${links.join("")}</div>` : ""}
    </div>
  </div>`;
}

function render(){
  renderStats();
  $("groups").innerHTML = GROUPS.map(g => {
    const rows = g.rows.filter(q => (filter === "all" || q.sec === filter) && !(hideDone && done[q.n]));
    const total = g.rows.filter(q => filter === "all" || q.sec === filter);
    if (!total.length) return "";
    const d = total.filter(q => done[q.n]).length;
    const range = `${total[0].n}–${total[total.length-1].n}`;
    return `<section class="${g.cls || ""}" aria-label="${esc(g.title)}">
      <h2>${esc(g.title)} <span class="count">#${range} · ${d}/${total.length} done</span></h2>
      ${g.note ? `<p class="note">${esc(g.note)}</p>` : ""}
      <div class="list">${rows.length ? rows.map(rowHTML).join("") : `<div class="empty">All done in this group.</div>`}</div>
    </section>`;
  }).join("");
}

function setNote(t){ $("save").textContent = t; }

function persist(){
  const snapshot = JSON.parse(JSON.stringify(done));
  if (store === "db") {
    writing = writing.then(() => ref.set({done: snapshot, updated: new Date().toISOString()}))
      .then(() => setNote("Saved."))
      .catch(e => { setNote(e && e.code === "invalid_argument" ? "You can view this tracker but not save ticks." : "Couldn't save just now. Your tick shows here but may be lost on reload."); });
  } else {
    try { localStorage.setItem("acc-oa-done", JSON.stringify(snapshot)); setNote("Saved in this browser only."); }
    catch { setNote("Ticks can't be saved in this view."); }
  }
}

document.addEventListener("change", e => {
  if (e.target.id === "hideDone") { hideDone = e.target.checked; render(); return; }
  const n = e.target.dataset && e.target.dataset.n;
  if (!n) return;
  if (e.target.checked) done[n] = new Date().toISOString().slice(0, 10); else delete done[n];
  render(); persist();
});
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  render();
}));

// Local fallback first so the page is useful immediately.
try { done = JSON.parse(localStorage.getItem("acc-oa-done") || "{}") || {}; } catch { done = {}; }
render();

(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) { store = "local"; setNote("Ticks are saved in this browser only."); return; }
  store = "db";
  ref = db.doc("progress/main");
  let first = true;
  ref.onSnapshot(snap => {
    const body = snap.exists ? snap.data() : null;
    if (body && body.done && typeof body.done === "object") done = {...body.done};
    else if (first && Object.keys(done).length) persist();   // carry over ticks made before the store answered
    first = false;
    render();
  }, () => { store = "local"; setNote("Saving is unavailable right now; ticks are kept in this browser."); });
})();
</script>
</body>
</html>
